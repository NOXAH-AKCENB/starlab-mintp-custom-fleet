<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="420" fill="#f8f9fa"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#212529">Tableau de bord du club</text>

  <!-- Indicateurs -->
  <g font-size="12">
    <rect x="20" y="45" width="130" height="78" rx="8" fill="#fff" stroke="#dee2e6"/>
    <text x="32" y="66" fill="#6c757d">Adhérents actifs</text>
    <text x="32" y="98" font-size="22" font-weight="bold" fill="#212529">42</text>
    <rect x="160" y="45" width="130" height="78" rx="8" fill="#fff" stroke="#dee2e6"/>
    <text x="172" y="66" fill="#6c757d">Montant non réglé</text>
    <text x="172" y="98" font-size="18" font-weight="bold" fill="#212529">185 000</text>
    <rect x="300" y="45" width="130" height="78" rx="8" fill="#fff" stroke="#dee2e6"/>
    <text x="312" y="66" fill="#6c757d">À facturer</text>
    <text x="312" y="98" font-size="22" font-weight="bold" fill="#212529">12</text>
    <rect x="440" y="45" width="130" height="78" rx="8" fill="#fff" stroke="#e03131"/>
    <text x="452" y="66" fill="#c92a2a">Cotisations en retard</text>
    <text x="452" y="98" font-size="22" font-weight="bold" fill="#e03131">5</text>
    <rect x="580" y="45" width="160" height="78" rx="8" fill="#fff" stroke="#dee2e6"/>
    <text x="592" y="66" fill="#6c757d">Solde des comptes</text>
    <text x="592" y="98" font-size="18" font-weight="bold" fill="#212529">1 240 500</text>
  </g>

  <!-- Graphique -->
  <rect x="20" y="140" width="720" height="170" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="36" y="164" font-size="13" font-weight="bold" fill="#212529">Recettes et dépenses sur 12 mois</text>
  <g>
    <rect x="50" y="250" width="14" height="40" fill="#28a745"/><rect x="66" y="230" width="14" height="60" fill="#dc3545"/>
    <rect x="110" y="240" width="14" height="50" fill="#28a745"/><rect x="126" y="260" width="14" height="30" fill="#dc3545"/>
    <rect x="170" y="200" width="14" height="90" fill="#28a745"/><rect x="186" y="235" width="14" height="55" fill="#dc3545"/>
    <rect x="230" y="225" width="14" height="65" fill="#28a745"/><rect x="246" y="245" width="14" height="45" fill="#dc3545"/>
    <rect x="290" y="210" width="14" height="80" fill="#28a745"/><rect x="306" y="240" width="14" height="50" fill="#dc3545"/>
    <rect x="350" y="230" width="14" height="60" fill="#28a745"/><rect x="366" y="250" width="14" height="40" fill="#dc3545"/>
    <rect x="410" y="200" width="14" height="90" fill="#28a745"/><rect x="426" y="228" width="14" height="62" fill="#dc3545"/>
    <rect x="470" y="235" width="14" height="55" fill="#28a745"/><rect x="486" y="250" width="14" height="40" fill="#dc3545"/>
    <rect x="530" y="222" width="14" height="68" fill="#28a745"/><rect x="546" y="240" width="14" height="50" fill="#dc3545"/>
    <rect x="590" y="215" width="14" height="75" fill="#28a745"/><rect x="606" y="245" width="14" height="45" fill="#dc3545"/>
    <rect x="650" y="228" width="14" height="62" fill="#28a745"/><rect x="666" y="236" width="14" height="54" fill="#dc3545"/>
    <rect x="710" y="238" width="0" height="0" fill="#28a745"/>
  </g>
  <line x1="40" y1="290" x2="720" y2="290" stroke="#adb5bd"/>
  <text x="50" y="304" font-size="10" fill="#6c757d">Mois 1 → 12 (vert : recettes, rouge : dépenses)</text>

  <!-- Dernières transactions -->
  <rect x="20" y="325" width="720" height="85" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="36" y="349" font-size="13" font-weight="bold" fill="#212529">Dernières transactions</text>
  <text x="36" y="372" font-size="11" fill="#495057">23/11/2026   Cotisations octobre (lot)            +  50 000</text>
  <text x="36" y="392" font-size="11" fill="#495057">22/11/2026   Achat tatamis                        −  20 000</text>
</svg>
