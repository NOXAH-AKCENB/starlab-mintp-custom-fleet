<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <g stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="150" y1="90" x2="185" y2="90"/>
    <line x1="335" y1="90" x2="370" y2="90"/>
    <line x1="520" y1="90" x2="555" y2="90"/>
    <path d="M640 120 L640 200 L80 200 L80 120"/>
  </g>
  <g>
    <rect x="20" y="50" width="130" height="80" rx="8" fill="#e7f5ff" stroke="#1c7ed6"/>
    <text x="85" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1864ab">1. Générer</text>
    <text x="85" y="102" text-anchor="middle" font-size="12" fill="#1864ab">cotisations</text>
    <text x="85" y="118" text-anchor="middle" font-size="11" fill="#495057">du mois</text>

    <rect x="185" y="50" width="150" height="80" rx="8" fill="#fff9db" stroke="#f08c00"/>
    <text x="260" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67700">2. À facturer</text>
    <text x="260" y="102" text-anchor="middle" font-size="12" fill="#e67700">sélection +</text>
    <text x="260" y="118" text-anchor="middle" font-size="12" fill="#e67700">remise</text>

    <rect x="370" y="50" width="150" height="80" rx="8" fill="#ebfbee" stroke="#2f9e44"/>
    <text x="445" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b8a3e">3. Facturé</text>
    <text x="445" y="102" text-anchor="middle" font-size="12" fill="#2b8a3e">facture envoyée</text>
    <text x="445" y="118" text-anchor="middle" font-size="11" fill="#495057">(à encaisser)</text>

    <rect x="555" y="50" width="185" height="80" rx="8" fill="#f1f3f5" stroke="#868e96"/>
    <text x="647" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">4. Payé</text>
    <text x="647" y="102" text-anchor="middle" font-size="12" fill="#495057">rapprochement</text>
    <text x="647" y="118" text-anchor="middle" font-size="11" fill="#495057">bancaire Odoo</text>
  </g>
  <rect x="200" y="200" width="360" height="60" rx="8" fill="#fff5f5" stroke="#e03131"/>
  <text x="380" y="226" text-anchor="middle" font-size="13" fill="#c92a2a">Facture échue et non payée → rappel e-mail automatique</text>
  <text x="380" y="246" text-anchor="middle" font-size="11" fill="#495057">(délai entre deux rappels : paramètres de la société)</text>
</svg>
